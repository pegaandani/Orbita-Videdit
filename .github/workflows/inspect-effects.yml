name: Inspect active video filters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-effects.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          python ci_patch_v050/prepare_linux_functional_test.py
          python - <<'PY'
          from pathlib import Path
          paths = [
            ('videdit_project/lib/core/services/timeline_render_service.dart', 902, 986),
            ('videdit_project/lib/features/editor/editor_screen.dart', None, None)
          ]
          for path,start,end in paths:
            s=Path(path).read_text().splitlines()
            if start is None:
              start=next(i for i,x in enumerate(s) if 'Widget _applyPreviewEffects(TimelineClip c,' in x)
              end=next(i for i,x in enumerate(s[start:],start) if 'Widget _previewTextWidget(' in x)
              start += 1
            print('FILE',path)
            for i in range(start-1,min(end,len(s))):
              print(f'{i+1}: {s[i]}')
          PY
